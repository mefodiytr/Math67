# /etc/nginx/sites-available/9moons.30000.ru
#
# Astro static export → nginx serve.
# TLS ставится через certbot (см. deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name 9moons.30000.ru;

    # ACME challenge для Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    # Все остальное — на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 9moons.30000.ru;

    # Сертификаты Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/9moons.30000.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/9moons.30000.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Безопасность
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Корень сайта (Astro static export)
    root /var/www/9moons.30000.ru;
    index index.html;

    # Логи
    access_log /var/log/nginx/9moons.access.log;
    error_log  /var/log/nginx/9moons.error.log warn;

    # Сжатие
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Кэш для статичных ассетов с хэшем
    location ~* ^/_astro/.*\.(js|css|woff2|svg|png|jpg|webp|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Картинки/PNG
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Чистые URL (без .html)
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # 404
    error_page 404 /404.html;
}
